{% load static %}

<div id="mini-sns" class="mini-sns" data-refresh-url="{% url 'mini_sns_feed' %}">

    <!-- =====================
         ヘッダー
    ====================== -->

    <div class="mini-sns-header">

        <a href="{% url 'sns' %}" class="mini-sns-logo-button" title="SNSを開く">
            Qhymia SNS
        </a>


        <div class="mini-sns-controls">

            <button id="mini-sns-refresh" type="button" aria-label="更新" title="更新">
                ↻
            </button>
            <button id="sns-minimize" type="button" aria-label="最小化">
                −
            </button>


            <button id="sns-close" type="button" aria-label="閉じる">
                ×
            </button>

        </div>

    </div>


    <div id="mini-sns-body" class="mini-sns-body">


        <!-- =====================
             投稿フォーム
        ====================== -->

        <form id="mini-sns-post-form" class="mini-sns-post-form" action="{% url 'mini_create_post' %}" method="post"
            enctype="multipart/form-data">

            {% csrf_token %}


            <textarea name="text" class="mini-sns-textarea" maxlength="500" rows="3" placeholder="いま何してる？"></textarea>


            <div class="mini-sns-form-bottom">

                <label class="mini-sns-image-button">

                    画像

                    <input type="file" name="image" accept="image/*">

                </label>


                <button type="submit" class="mini-sns-submit-button">
                    投稿する
                </button>

            </div>


            <p id="mini-sns-post-error" class="mini-sns-post-error">
            </p>

        </form>

<div class="mini-sns-tabs">

    <button
        type="button"
        class="mini-sns-tab
        {% if mini_sns_view_mode == 'recommended' %}
            active
        {% endif %}"
        data-view="recommended"
    >
        ★ おすすめ
    </button>


    <button
        type="button"
        class="mini-sns-tab
        {% if mini_sns_view_mode == 'latest' %}
            active
        {% endif %}"
        data-view="latest"
    >
        ▤ 新着
    </button>


    <button
        type="button"
        class="mini-sns-tab
        {% if mini_sns_view_mode == 'favorites' %}
            active
        {% endif %}"
        data-view="favorites"
    >
        ☆ お気に入り
    </button>

</div>
        <!-- =====================
             投稿一覧
        ====================== -->

        <div id="mini-sns-post-list" class="mini-sns-post-list">

            {% include "mini_sns_posts.html" %}

        </div>


        <!-- =====================
             通常SNS
        ====================== -->

        <a href="{% url 'sns' %}" class="sns-open-button">
            SNSを開く →
        </a>

    </div>

</div>
