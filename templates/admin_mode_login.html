{% extends "base.html" %}

{% block title %}
管理者モード認証 | Qhymia
{% endblock %}

{% block content %}

<div class="admin-login-page">

    <div class="admin-login-card">

        <p class="admin-login-label">
            ADMIN MODE
        </p>

        <h1>
            管理者モード認証
        </h1>

        <p>
            管理者用パスワードを入力してください。
        </p>

        <form method="post">

            {% csrf_token %}

            <input type="password" name="password" placeholder="管理者パスワード" required>

            <button type="submit">
                管理者モードを有効にする
            </button>

        </form>

        <a href="{% url 'home' %}">
            ← ホームへ戻る
        </a>

    </div>

</div>

{% endblock %}
