{% extends "base.html" %}
{% load static %}

{% block title %}
管理者モード認証 | Qhymia
{% endblock %}

{% block content %}

<link
    rel="stylesheet"
    href="{% static 'css/admin.css' %}"
>


<!-- =============================
     管理者ログイン専用ヘッダー
============================== -->

<div class="admin-login-header">

    <div class="admin-login-logo">
        Qhymia
    </div>

    <div class="admin-login-header-title">
        ADMIN MODE
    </div>

</div>


<!-- =============================
     管理者認証
============================== -->

<div class="admin-login-page">

    <section class="admin-login-area">

        <h1>
            管理者モード認証
        </h1>


        <form method="post" class="admin-login-form">

            {% csrf_token %}

            <input
                type="password"
                name="password"
                placeholder="パスワード"
                required
            >

            <button type="submit">
                有効にする
            </button>

        </form>


        <a
            href="{% url 'home' %}"
            class="admin-login-home"
        >
            ホームへ戻る
        </a>

    </section>


    <!-- =============================
         警告
    ============================== -->

    <div class="admin-login-warning">

        <p>
            不正なアクセスは無期限のアカウント停止になります。
        </p>

        <p>
            ＜ホームへ戻る＞からお戻りください。
        </p>

    </div>

</div>

{% endblock %}
