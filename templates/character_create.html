{% extends "base.html" %}

{% block title %}
キャラクター作成 | Qhymia
{% endblock %}

{% block content %}

<div class="character-create">

    <h1>キャラクター作成</h1>

    <p>
        ゲーム内で使用するキャラクター名を入力してください。
    </p>

    {% if error_message %}
        <p>
            {{ error_message }}
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="character_name">
            キャラクター名
        </label>

        <input
            type="text"
            id="character_name"
            name="character_name"
            maxlength="20"
            required
        >

        <div class="form-group">
            <label for="race">種族</label>
            <select name="race" id="race" required>
                <option value="human">ヒューマン</option>
                <option value="elf">エルフ</option>
                <option value="dwarf">ドワーフ</option>
                <option value="dragonia">ドラゴニア</option>
                <option value="witch">ウィッチ</option>
                <option value="fairy">フェアリー</option>
                <option value="demonia">デモニア</option>
            </select>
        </div>

        <div class="form-group">
            <label for="job">職業</label>
            <select name="job" id="job" required>
                <option value="grappler">拳闘士</option>
                <option value="warrior">重戦士</option>
                <option value="hunter">狩人</option>
                <option value="wizard">ウィザード</option>
                <option value="priest">プリースト</option>
                <option value="wanderer">放浪人</option>
                <option value="assassin">暗殺者</option>
            </select>
        </div>

        <button type="submit">
            キャラクターを作成
        </button>

    </form>

</div>

{% endblock %}
