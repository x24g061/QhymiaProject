{% extends "base.html" %}
{% load socialaccount %}
{% block content %}

<div class="login-page">
    <div class="login-card">

        <h1 class="login-logo">Qhymia</h1>
        <p class="login-title">ログイン</p>

        {% if error_message %}
            <p class="error-message">
                {{ error_message }}
            </p>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="user_id">固有ID</label>
                <input
                    type="text"
                    id="user_id"
                    name="user_id"
                    placeholder="固有IDを入力"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="パスワードを入力"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                ログイン
            </button>
        </form>

        <div class="separator">
            <span>または</span>
        </div>

      <a href="{% provider_login_url 'google' %}" class="google-button">
    <span class="google-mark">G</span>
    Googleでログイン
</a>

    </div>
</div>

{% endblock %}
