{% extends "base.html" %}

{% block content %}

<div class="login-container">

    <div class="login-box">

        <h1>Qhymia</h1>
        <p class="login-title">ログイン</p>

        <!-- エラーメッセージ -->
        {% if error_message %}
            <p class="error-message">
                {{ error_message }}
            </p>
        {% endif %}

        <!-- 固有ID・パスワードログイン -->
        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label for="user_id">固有ID</label>

                <input
                    type="text"
                    id="user_id"
                    name="user_id"
                    placeholder="固有IDを入力"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="パスワードを入力"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                ログイン
            </button>

        </form>

        <!-- 区切り -->
        <div class="separator">
            <span>または</span>
        </div>

        <!-- Googleログイン -->
        <button type="button" class="google-button">
            Googleでログイン
        </button>

    </div>

</div>

{% endblock %}
